name: Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: code/package-lock.json

      - name: Install
        run: npm ci
        working-directory: code

      - name: Run DB migrations
        run: |
          psql "${{ secrets.DATABASE_URL }}" \
            -c "ALTER TABLE products ADD COLUMN IF NOT EXISTS product_brand TEXT DEFAULT '';"
          psql "${{ secrets.DATABASE_URL }}" \
            -c "ALTER TABLE products ADD COLUMN IF NOT EXISTS product_type TEXT DEFAULT '';"
          psql "${{ secrets.DATABASE_URL }}" \
            -c "CREATE INDEX IF NOT EXISTS idx_products_product_brand ON products(product_brand) WHERE product_brand != '';"
          psql "${{ secrets.DATABASE_URL }}" \
            -c "CREATE INDEX IF NOT EXISTS idx_products_product_type ON products(product_type) WHERE product_type != '';"
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'

      - name: Build & Deploy
        run: npm run deploy
        working-directory: code
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          USE_POSTGRES: true
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
