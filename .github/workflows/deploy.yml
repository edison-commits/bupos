name: Deploy

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

defaults:
  run:
    working-directory: code

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: code/package-lock.json

      - name: Install
        run: npm ci

      # R25-ops-M-2: assert every secret the Worker needs at runtime is
      # actually configured. Without this, a missing CUSTOMER_DISPLAY_
      # SECRET / RESEND_API_KEY / RESEND_FROM silently breaks the
      # customer-display + signup-verification features in prod.
      #
      # Runs only on push to master (not PR) because PRs don't deploy
      # and shouldn't gate on secret presence. `wrangler secret list`
      # prints NAMES only, never values.
      - name: Assert required Worker secrets are configured
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # R26-F7: parse wrangler's JSON output with jq rather than
          # substring-grep. The prior grep pattern
          # (`grep -q "\"name\": \"$secret\""`) was brittle for several
          # reasons:
          #   • Whitespace-sensitive: `"name":"X"` (no space after colon)
          #     would false-negative. wrangler formatting can flip with a
          #     version bump.
          #   • Substring matching: a secret named "DB" would match a row
          #     with "DB_URL", yielding a false OK.
          #   • Output prefix from npx/wrangler (warnings, deprecation
          #     banners) mixed into stdout breaks the later grep.
          # jq exits 2 on invalid JSON, so a wrangler auth failure fails
          # the step instead of being swallowed by `|| echo '[]'`.
          REQUIRED=(CUSTOMER_DISPLAY_SECRET RESEND_API_KEY RESEND_FROM_EMAIL DATABASE_URL)
          echo "→ Listing Worker secrets..."
          # Split stderr (warnings) from stdout (JSON payload). Some
          # wrangler versions emit a deprecation notice on stderr that
          # jq would otherwise reject.
          SECRETS_JSON=$(npx wrangler secret list 2>/dev/null)
          if [ -z "$SECRETS_JSON" ]; then
            echo "::error::wrangler secret list produced no output — auth may be misconfigured"
            echo "Verify CLOUDFLARE_API_TOKEN has Worker:Edit + Account:Read scope"
            exit 1
          fi
          if ! echo "$SECRETS_JSON" | jq -e 'type == "array"' >/dev/null; then
            echo "::error::wrangler secret list output is not a JSON array:"
            echo "$SECRETS_JSON" | head -20
            exit 1
          fi
          # Pull out just the names into a newline-separated list.
          PRESENT=$(echo "$SECRETS_JSON" | jq -r '.[].name')
          MISSING=()
          for secret in "${REQUIRED[@]}"; do
            if ! echo "$PRESENT" | grep -Fxq "$secret"; then
              MISSING+=("$secret")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Required Worker secret(s) not configured: ${MISSING[*]}"
            echo "Set via: wrangler secret put <NAME>"
            exit 1
          fi
          echo "✓ All required Worker secrets present"

      # R25-ops-C-2: previously this step ran ~25 hand-rolled
      # `ALTER TABLE IF NOT EXISTS` statements inline and NEVER
      # iterated `code/supabase/migrations/*.sql`. Result: migrations
      # 040-053 (RPC codification, RLS hardening, unique constraints
      # from R21-C-1 / R22-C-1 / R22-H-4 / R22-H-3) may never have
      # reached prod unless someone ran `psql` manually.
      #
      # New shape: iterate every file under
      # `code/supabase/migrations/*.sql` in sorted order, tracking
      # applied migrations in a `_migrations` table. Idempotent —
      # every migration uses `IF NOT EXISTS` / `CREATE OR REPLACE` /
      # guarded `DO` blocks so re-running a committed migration is
      # a no-op.
      #
      # Safety: `ON_ERROR_STOP=1` ensures a genuine migration failure
      # aborts the deploy (prior inline approach silently continued
      # past failures).
      - name: Run DB migrations
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        working-directory: .
        run: |
          set -euo pipefail
          DB_URL="${{ secrets.DATABASE_URL }}"
          MIG_DIR="code/supabase/migrations"

          echo "→ Ensuring _migrations tracker table exists"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "
            CREATE TABLE IF NOT EXISTS _migrations (
              filename TEXT PRIMARY KEY,
              applied_at TIMESTAMPTZ NOT NULL DEFAULT now()
            );
          " >/dev/null

          echo "→ Iterating migrations in $MIG_DIR"
          # R27-M14: migration filenames are now regex-validated BEFORE
          # being concatenated into any SQL string. A malicious PR
          # landing a file named e.g. `054_x';DROP TABLE _migrations;--.sql`
          # was otherwise interpolated as `WHERE filename='054_x';DROP TABLE
          # _migrations;--.sql'` — the `psql -c` statement separator honors
          # semicolons, which means the DROP runs as the `postgres` role.
          # The regex rejects anything outside the canonical migration
          # naming pattern. Even with the regex, we also pass filename
          # via psql's `-v` binding so SQL syntax can't escape anyway.
          for f in $(ls "$MIG_DIR"/*.sql | sort); do
            basename=$(basename "$f")
            if [[ "$basename" =~ ^_ ]]; then continue; fi
            if ! [[ "$basename" =~ ^[0-9]{3}_[a-z0-9_]+\.sql$ ]]; then
              echo "::error::Migration filename fails naming policy: $basename"
              echo "Expected ^[0-9]{3}_[a-z0-9_]+\.sql\$"
              exit 1
            fi
            # R36-deploy: `psql -c "...:'mig'"` + `-v mig=...` does NOT
            # interpolate — psql's `:variable` substitution only runs for
            # `-f` / stdin / interactive, not for `-c`. That's a known
            # quirk, not a version regression. The previous shape
            # errored with "syntax error at or near \":\"" because psql
            # saw the literal `:'mig'` token in the SQL text.
            # The regex gate above constrains `$basename` to
            # ^[0-9]{3}_[a-z0-9_]+\.sql$ — no quotes, no backslashes, no
            # whitespace — so shell interpolation here is safe.
            applied=$(psql "$DB_URL" -tAc \
              "SELECT COUNT(*) FROM _migrations WHERE filename = '$basename'")
            if [ "$applied" = "0" ]; then
              echo "→ Applying $basename"
              psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f" >/dev/null
              psql "$DB_URL" -v ON_ERROR_STOP=1 \
                -c "INSERT INTO _migrations (filename) VALUES ('$basename')" \
                >/dev/null
            else
              echo "   Skipping $basename (already applied)"
            fi
          done
          echo "✓ All migrations applied"

      - name: Build & Deploy
        run: npm run deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          USE_POSTGRES: true
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'

      - name: Smoke test
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          npx playwright install chromium --with-deps
          node scripts/smoke-test.js

      # R27-M14: Telegram bot token moves to env so it's not substituted
      # into the shell line by GitHub Actions. `${{ secrets.X }}` in a
      # `run:` string is literally expanded before the shell sees it —
      # a malicious workflow edit could swap the URL to `evil.com/{{ TOKEN }}`
      # and exfiltrate the token on the next successful deploy. With the
      # env-var form, GitHub redacts the value from logs AND shell-level
      # parameter expansion prevents the substitution trick.
      - name: Notify on success
        if: success() && github.ref == 'refs/heads/master' && github.event_name == 'push'
        working-directory: .
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="7547010501" \
            -d text="✅ bupos deployed to basicuniformpos.com (${{ github.sha }})" \
            -d disable_notification=true

      - name: Notify on failure
        if: failure() && github.ref == 'refs/heads/master' && github.event_name == 'push'
        working-directory: .
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="7547010501" \
            -d text="❌ bupos deploy FAILED (${{ github.sha }}) — check https://github.com/edison-commits/bupos/actions"
