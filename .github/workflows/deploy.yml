name: Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: code/package-lock.json

      - name: Install
        run: npm ci
        working-directory: code

      - name: Run DB migrations
        run: |
          psql "${{ secrets.DATABASE_URL }}" \
            -c "ALTER TABLE products ADD COLUMN IF NOT EXISTS product_brand TEXT DEFAULT '';"
          psql "${{ secrets.DATABASE_URL }}" \
            -c "ALTER TABLE products ADD COLUMN IF NOT EXISTS product_type TEXT DEFAULT '';"
          psql "${{ secrets.DATABASE_URL }}" \
            -c "CREATE INDEX IF NOT EXISTS idx_products_product_brand ON products(product_brand) WHERE product_brand != '';"
          psql "${{ secrets.DATABASE_URL }}" \
            -c "CREATE INDEX IF NOT EXISTS idx_products_product_type ON products(product_type) WHERE product_type != '';"
          psql "${{ secrets.DATABASE_URL }}" \
            -c "ALTER TABLE organizations ADD COLUMN IF NOT EXISTS receipt_store_name TEXT DEFAULT '';"
          psql "${{ secrets.DATABASE_URL }}" \
            -c "ALTER TABLE organizations ADD COLUMN IF NOT EXISTS receipt_store_address TEXT DEFAULT '';"
          psql "${{ secrets.DATABASE_URL }}" \
            -c "ALTER TABLE organizations ADD COLUMN IF NOT EXISTS receipt_store_city TEXT DEFAULT '';"
          psql "${{ secrets.DATABASE_URL }}" \
            -c "ALTER TABLE organizations ADD COLUMN IF NOT EXISTS receipt_store_region TEXT DEFAULT '';"
          psql "${{ secrets.DATABASE_URL }}" \
            -c "ALTER TABLE organizations ADD COLUMN IF NOT EXISTS receipt_store_postal_code TEXT DEFAULT '';"
          psql "${{ secrets.DATABASE_URL }}" \
            -c "ALTER TABLE organizations ADD COLUMN IF NOT EXISTS receipt_store_phone TEXT DEFAULT '';"
          psql "${{ secrets.DATABASE_URL }}" \
            -c "CREATE TABLE IF NOT EXISTS audit_events (id UUID DEFAULT gen_random_uuid(), organization_id UUID NOT NULL, location_id UUID, actor_employee_id UUID, entity_type TEXT NOT NULL, entity_id UUID, event_kind TEXT NOT NULL, payload JSONB DEFAULT '{}', created_at TIMESTAMPTZ DEFAULT NOW());"
          psql "${{ secrets.DATABASE_URL }}" \
            -c "CREATE INDEX IF NOT EXISTS idx_audit_events_org ON audit_events(organization_id);"
          psql "${{ secrets.DATABASE_URL }}" \
            -c "CREATE INDEX IF NOT EXISTS idx_audit_events_entity ON audit_events(entity_type, entity_id);"
          psql "${{ secrets.DATABASE_URL }}" \
            -c "CREATE INDEX IF NOT EXISTS idx_audit_events_created ON audit_events(created_at DESC);"

          # Scheduled shifts
          psql "${{ secrets.DATABASE_URL }}" \
            -c "CREATE TABLE IF NOT EXISTS scheduled_shifts (id UUID DEFAULT gen_random_uuid() PRIMARY KEY, organization_id UUID NOT NULL, location_id UUID NOT NULL, employee_id UUID NOT NULL, shift_date DATE NOT NULL, start_time TIME NOT NULL, end_time TIME NOT NULL, notes TEXT DEFAULT '', created_at TIMESTAMPTZ DEFAULT NOW(), created_by UUID, UNIQUE(location_id, employee_id, shift_date, start_time));"
          psql "${{ secrets.DATABASE_URL }}" \
            -c "CREATE INDEX IF NOT EXISTS idx_scheduled_shifts_loc_date ON scheduled_shifts(location_id, shift_date);"
          psql "${{ secrets.DATABASE_URL }}" \
            -c "CREATE INDEX IF NOT EXISTS idx_scheduled_shifts_employee ON scheduled_shifts(employee_id);"

          # Time-off requests
          psql "${{ secrets.DATABASE_URL }}" \
            -c "CREATE TABLE IF NOT EXISTS time_off_requests (id UUID DEFAULT gen_random_uuid() PRIMARY KEY, organization_id UUID NOT NULL, employee_id UUID NOT NULL, request_type TEXT NOT NULL CHECK (request_type IN ('vacation','sick','personal','bereavement','jury_duty','other')), start_date DATE NOT NULL, end_date DATE NOT NULL, status TEXT NOT NULL DEFAULT 'pending' CHECK (status IN ('pending','approved','rejected')), notes TEXT DEFAULT '', requested_at TIMESTAMPTZ DEFAULT NOW(), reviewed_by UUID, reviewed_at TIMESTAMPTZ);"
          psql "${{ secrets.DATABASE_URL }}" \
            -c "CREATE INDEX IF NOT EXISTS idx_time_off_requests_org_employee ON time_off_requests(organization_id, employee_id);"

          # Scheduled shifts
          psql "${{ secrets.DATABASE_URL }}" \
            -c "CREATE TABLE IF NOT EXISTS scheduled_shifts (id UUID DEFAULT gen_random_uuid() PRIMARY KEY, organization_id UUID NOT NULL, location_id UUID NOT NULL, employee_id UUID NOT NULL, shift_date DATE NOT NULL, start_time TIME NOT NULL, end_time TIME NOT NULL, notes TEXT DEFAULT '', created_at TIMESTAMPTZ DEFAULT NOW(), created_by UUID, UNIQUE(location_id, employee_id, shift_date, start_time));"
          psql "${{ secrets.DATABASE_URL }}" \
            -c "CREATE INDEX IF NOT EXISTS idx_scheduled_shifts_loc_date ON scheduled_shifts(location_id, shift_date);"
          psql "${{ secrets.DATABASE_URL }}" \
            -c "CREATE INDEX IF NOT EXISTS idx_scheduled_shifts_employee ON scheduled_shifts(employee_id);"

          # Time-off requests
          psql "${{ secrets.DATABASE_URL }}" \
            -c "CREATE TABLE IF NOT EXISTS time_off_requests (id UUID DEFAULT gen_random_uuid() PRIMARY KEY, organization_id UUID NOT NULL, employee_id UUID NOT NULL, request_type TEXT NOT NULL CHECK (request_type IN ('vacation','sick','personal','bereavement','jury_duty','other')), start_date DATE NOT NULL, end_date DATE NOT NULL, status TEXT NOT NULL DEFAULT 'pending' CHECK (status IN ('pending','approved','rejected')), notes TEXT DEFAULT '', requested_at TIMESTAMPTZ DEFAULT NOW(), reviewed_by UUID, reviewed_at TIMESTAMPTZ);"
          psql "${{ secrets.DATABASE_URL }}" \
            -c "CREATE INDEX IF NOT EXISTS idx_time_off_requests_org_employee ON time_off_requests(organization_id, employee_id);"

          # Optimistic locking: add updated_at to products and product_variants
          psql "${{ secrets.DATABASE_URL }}" \
            -c "ALTER TABLE products ADD COLUMN IF NOT EXISTS updated_at TIMESTAMPTZ DEFAULT NOW();"
          psql "${{ secrets.DATABASE_URL }}" \
            -c "ALTER TABLE product_variants ADD COLUMN IF NOT EXISTS updated_at TIMESTAMPTZ DEFAULT NOW();"
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'

      - name: Build & Deploy
        run: npm run deploy
        working-directory: code
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          USE_POSTGRES: true
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'

      - name: Notify on success
        if: success() && github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="7547010501" \
            -d text="✅ bupos deployed to basicuniformpos.com (${{ github.sha }})" \
            -d disable_notification=true

      - name: Notify on failure
        if: failure() && github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="7547010501" \
            -d text="❌ bupos deploy FAILED (${{ github.sha }}) — check https://github.com/edison-commits/bupos/actions"
