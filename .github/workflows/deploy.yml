name: Deploy

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# R42-H: least-privilege token. Default permissions in GitHub Actions
# include write on contents + pull-requests; this workflow only needs
# to read the repo. A compromised dependency running during `npm ci`
# lifecycle scripts is limited to what the token can touch.
# `actions: read` added for the wait-for-Guardrails gate (lists this
# repo's workflow runs; still read-only).
permissions:
  contents: read
  actions: read

defaults:
  run:
    working-directory: code

jobs:
  deploy:
    # R42-H: gate the whole job on same-repo provenance. A fork PR opens
    # `pull_request` at our repo; without this `if:`, a malicious fork
    # could edit `package.json` to add a `preinstall` script that
    # exfiltrates the runner environment during `npm ci` below. Post-
    # install steps were already gated on `push && master`, but the
    # install step itself ran unconditionally. This gate makes the
    # entire job a no-op for fork PRs (same-repo PRs still run the
    # install-and-typecheck path; push-to-master runs the full deploy).
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: code/package-lock.json

      - name: Install
        run: npm ci

      # R25-ops-M-2: assert every secret the Worker needs at runtime is
      # actually configured. Without this, a missing CUSTOMER_DISPLAY_
      # SECRET / RESEND_API_KEY / RESEND_FROM silently breaks the
      # customer-display + signup-verification features in prod.
      #
      # Runs only on push to master (not PR) because PRs don't deploy
      # and shouldn't gate on secret presence. `wrangler secret list`
      # prints NAMES only, never values.
      - name: Assert required Worker secrets are configured
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # R26-F7: parse wrangler's JSON output with jq rather than
          # substring-grep. The prior grep pattern
          # (`grep -q "\"name\": \"$secret\""`) was brittle for several
          # reasons:
          #   • Whitespace-sensitive: `"name":"X"` (no space after colon)
          #     would false-negative. wrangler formatting can flip with a
          #     version bump.
          #   • Substring matching: a secret named "DB" would match a row
          #     with "DB_URL", yielding a false OK.
          #   • Output prefix from npx/wrangler (warnings, deprecation
          #     banners) mixed into stdout breaks the later grep.
          # jq exits 2 on invalid JSON, so a wrangler auth failure fails
          # the step instead of being swallowed by `|| echo '[]'`.
          REQUIRED=(CUSTOMER_DISPLAY_SECRET RESEND_API_KEY RESEND_FROM_EMAIL DATABASE_URL)
          echo "→ Listing Worker secrets..."
          # Split stderr (warnings) from stdout (JSON payload). Some
          # wrangler versions emit a deprecation notice on stderr that
          # jq would otherwise reject.
          SECRETS_JSON=$(npx wrangler secret list 2>/dev/null)
          if [ -z "$SECRETS_JSON" ]; then
            echo "::error::wrangler secret list produced no output — auth may be misconfigured"
            echo "Verify CLOUDFLARE_API_TOKEN has Worker:Edit + Account:Read scope"
            exit 1
          fi
          if ! echo "$SECRETS_JSON" | jq -e 'type == "array"' >/dev/null; then
            echo "::error::wrangler secret list output is not a JSON array:"
            echo "$SECRETS_JSON" | head -20
            exit 1
          fi
          # Pull out just the names into a newline-separated list.
          PRESENT=$(echo "$SECRETS_JSON" | jq -r '.[].name')
          MISSING=()
          for secret in "${REQUIRED[@]}"; do
            if ! echo "$PRESENT" | grep -Fxq "$secret"; then
              MISSING+=("$secret")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Required Worker secret(s) not configured: ${MISSING[*]}"
            echo "Set via: wrangler secret put <NAME>"
            exit 1
          fi
          echo "✓ All required Worker secrets present"

      # R25-ops-C-2: previously this step ran ~25 hand-rolled
      # `ALTER TABLE IF NOT EXISTS` statements inline and NEVER
      # iterated `code/supabase/migrations/*.sql`. Result: migrations
      # 040-053 (RPC codification, RLS hardening, unique constraints
      # from R21-C-1 / R22-C-1 / R22-H-4 / R22-H-3) may never have
      # reached prod unless someone ran `psql` manually.
      #
      # New shape: iterate every file under
      # `code/supabase/migrations/*.sql` in sorted order, tracking
      # applied migrations in a `_migrations` table. Idempotent —
      # every migration uses `IF NOT EXISTS` / `CREATE OR REPLACE` /
      # guarded `DO` blocks so re-running a committed migration is
      # a no-op.
      #
      # Safety: `ON_ERROR_STOP=1` ensures a genuine migration failure
      # aborts the deploy (prior inline approach silently continued
      # past failures).
      # PKG2-postmortem: Deploy previously ran in PARALLEL with the
      # Guardrails workflow, so a commit whose Playwright e2e FAILED
      # could still ship (44992c2: a circular import crashed every
      # /admin page — the e2e caught it, but the deploy didn't wait for
      # the answer). This step blocks every prod-mutating step below
      # (migrations, worker publish) until the Guardrails run for THIS
      # commit concludes successfully. Checkout/install above still
      # overlap with Guardrails, so the added wall time is only the
      # residual. FAIL-CLOSED: a failed, missing, or timed-out
      # Guardrails run blocks the deploy — fix (or re-run Guardrails),
      # then re-run this workflow.
      - name: Wait for Guardrails (incl. e2e) on this commit
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"
          DEADLINE=$(( $(date +%s) + 1500 ))   # 25-min hard cap
          FOUND_BY=$(( $(date +%s) + 180 ))    # the run must EXIST within 3 min
          echo "→ Waiting for the Guardrails workflow on $SHA"
          while true; do
            RUN=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "Guardrails")] | sort_by(.run_started_at) | last // empty')
            if [ -z "$RUN" ]; then
              if [ "$(date +%s)" -gt "$FOUND_BY" ]; then
                echo "::error::No Guardrails run found for $SHA — failing closed (was the workflow renamed?)."
                exit 1
              fi
              echo "   Guardrails run not visible yet…"
            else
              STATUS=$(echo "$RUN" | jq -r '.status')
              CONCLUSION=$(echo "$RUN" | jq -r '.conclusion // empty')
              if [ "$STATUS" = "completed" ]; then
                if [ "$CONCLUSION" = "success" ]; then
                  echo "✓ Guardrails succeeded — proceeding with deploy."
                  exit 0
                fi
                echo "::error::Guardrails concluded '$CONCLUSION' for $SHA — blocking deploy."
                exit 1
              fi
              echo "   Guardrails: $STATUS…"
            fi
            if [ "$(date +%s)" -gt "$DEADLINE" ]; then
              echo "::error::Timed out (25m) waiting for Guardrails — blocking deploy."
              exit 1
            fi
            sleep 20
          done

      - name: Run DB migrations
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        working-directory: .
        run: |
          set -euo pipefail
          DB_URL="${{ secrets.DATABASE_URL }}"
          MIG_DIR="code/supabase/migrations"

          echo "→ Ensuring _migrations tracker table exists"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "
            CREATE TABLE IF NOT EXISTS _migrations (
              filename TEXT PRIMARY KEY,
              applied_at TIMESTAMPTZ NOT NULL DEFAULT now()
            );
          " >/dev/null

          echo "→ Iterating migrations in $MIG_DIR"
          # R27-M14: migration filenames are now regex-validated BEFORE
          # being concatenated into any SQL string. A malicious PR
          # landing a file named e.g. `054_x';DROP TABLE _migrations;--.sql`
          # was otherwise interpolated as `WHERE filename='054_x';DROP TABLE
          # _migrations;--.sql'` — the `psql -c` statement separator honors
          # semicolons, which means the DROP runs as the `postgres` role.
          # The regex rejects anything outside the canonical migration
          # naming pattern. Even with the regex, we also pass filename
          # via psql's `-v` binding so SQL syntax can't escape anyway.
          for f in $(ls "$MIG_DIR"/*.sql | sort); do
            basename=$(basename "$f")
            if [[ "$basename" =~ ^_ ]]; then continue; fi
            if ! [[ "$basename" =~ ^[0-9]{3}_[a-z0-9_]+\.sql$ ]]; then
              echo "::error::Migration filename fails naming policy: $basename"
              echo "Expected ^[0-9]{3}_[a-z0-9_]+\.sql\$"
              exit 1
            fi
            # R36-deploy: `psql -c "...:'mig'"` + `-v mig=...` does NOT
            # interpolate — psql's `:variable` substitution only runs for
            # `-f` / stdin / interactive, not for `-c`. That's a known
            # quirk, not a version regression. The previous shape
            # errored with "syntax error at or near \":\"" because psql
            # saw the literal `:'mig'` token in the SQL text.
            # The regex gate above constrains `$basename` to
            # ^[0-9]{3}_[a-z0-9_]+\.sql$ — no quotes, no backslashes, no
            # whitespace — so shell interpolation here is safe.
            # R43-LOW: ON_ERROR_STOP on the probe + numeric validation.
            # Prior shape could receive a non-numeric value (notice/warning
            # emitted by postgres client stdout on version mismatch),
            # evaluate `[ "$applied" = "0" ]` false, skip the migration,
            # and print "✓ All migrations applied" — silent migration
            # skip. The numeric regex guard is belt-and-suspenders.
            applied=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc \
              "SELECT COUNT(*) FROM _migrations WHERE filename = '$basename'")
            if ! [[ "$applied" =~ ^[0-9]+$ ]]; then
              echo "::error::Unexpected probe response for $basename: $applied"
              exit 1
            fi
            if [ "$applied" = "0" ]; then
              echo "→ Applying $basename"
              psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f" >/dev/null
              psql "$DB_URL" -v ON_ERROR_STOP=1 \
                -c "INSERT INTO _migrations (filename) VALUES ('$basename')" \
                >/dev/null
            else
              echo "   Skipping $basename (already applied)"
            fi
          done
          echo "✓ All migrations applied"

      # R37-M2: typecheck gates the build on master pushes. guardrails.yml
      # runs tsc on PRs, but direct commits to master (or a branch-
      # protection bypass) would previously skip it and could ship a TS
      # error that slipped past the per-PR gate.
      - name: Typecheck
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: npx tsc --noEmit

      - name: Build & Deploy
        run: npm run deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          USE_POSTGRES: true
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'

      - name: Smoke test
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        # R36-deploy: GitHub Actions does NOT inject repo secrets into
        # `process.env` automatically — each secret a `run:` step needs
        # must be named in the step's `env:` block. Without these, the
        # Playwright script at scripts/smoke-test.js bails with
        # "Missing required env vars: SMOKE_ADMIN_EMAIL ...".
        env:
          SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
          SMOKE_EMPLOYEE_PIN: ${{ secrets.SMOKE_EMPLOYEE_PIN }}
        run: |
          npx playwright install chromium --with-deps
          node scripts/smoke-test.js

      # R27-M14: Telegram bot token moves to env so it's not substituted
      # into the shell line by GitHub Actions. `${{ secrets.X }}` in a
      # `run:` string is literally expanded before the shell sees it —
      # a malicious workflow edit could swap the URL to `evil.com/{{ TOKEN }}`
      # and exfiltrate the token on the next successful deploy. With the
      # env-var form, GitHub redacts the value from logs AND shell-level
      # parameter expansion prevents the substitution trick.
      - name: Notify on success
        if: success() && github.ref == 'refs/heads/master' && github.event_name == 'push'
        working-directory: .
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="7547010501" \
            -d text="✅ bupos deployed to basicuniformpos.com (${{ github.sha }})" \
            -d disable_notification=true

      - name: Notify on failure
        if: failure() && github.ref == 'refs/heads/master' && github.event_name == 'push'
        working-directory: .
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="7547010501" \
            -d text="❌ bupos deploy FAILED (${{ github.sha }}) — check https://github.com/edison-commits/bupos/actions"

  # SIM-AUDIT8: production schema-drift monitor. Runs AFTER `deploy` (so the
  # commit's migrations have already been applied to prod), spins up a fresh
  # Postgres, migrates it as the SOURCE-OF-TRUTH reference, and diffs prod's
  # columns against it. Catches the silent CREATE/ALTER-IF-NOT-EXISTS drift
  # class that left `returns` (transaction_id, updated_at) + `organizations`
  # (approval_thresholds, loyalty_config) missing in prod while check:schema
  # — which models the migrations, not the live DB — stayed green. Pages on
  # drift so it's a "fix-forward with a repair migration" alarm, not a silent
  # 100%-broken feature.
  drift-check:
    name: Prod schema-drift
    needs: deploy
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bupos_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bupos_test"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: code/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Migrate the reference DB (source of truth)
        run: bash scripts/docker-migrate.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:54329/bupos_test
      - name: Compare prod against the migrated reference
        run: npm run check:prod-drift
        env:
          REFERENCE_DATABASE_URL: postgresql://postgres:postgres@localhost:54329/bupos_test
          PROD_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Page on drift
        if: failure()
        working-directory: .
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="7547010501" \
            -d text="⚠️ bupos PROD SCHEMA DRIFT detected (${{ github.sha }}) — a migration column is missing in prod. See the drift-check job: https://github.com/edison-commits/bupos/actions"
