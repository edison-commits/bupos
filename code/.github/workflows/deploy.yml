name: Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: code/package-lock.json

      - name: Install
        run: npm ci
        working-directory: code

      - name: Run DB migrations
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "Applying migration: $f"
            psql "$DATABASE_URL" -f "$f" || { echo "Migration failed: $f"; exit 1; }
          done
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build & Deploy
        run: npm run deploy
        working-directory: code
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          USE_POSTGRES: "true"
          NEXT_PUBLIC_SUPABASE_URL: "https://yxzzawwrkzcqqtsbdgzf.supabase.co"
          BUPOS_ORG_ID: "713b3ff4-0582-40b1-98b0-02303af31e6f"
          BUPOS_LOCATION_ID: "a237b403-e722-4e40-b0ba-97000c6521c1"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
