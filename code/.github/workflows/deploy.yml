name: Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: code/package-lock.json

      - name: Install
        run: npm ci
        working-directory: code

      - name: Run DB migrations
        run: |
          psql "$DATABASE_URL" -c "
            CREATE TABLE IF NOT EXISTS _migrations (
              filename TEXT PRIMARY KEY,
              applied_at TIMESTAMPTZ NOT NULL DEFAULT now()
            );
          " || true
          for f in $(ls supabase/migrations/*.sql | sort); do
            basename=$(basename "$f")
            applied=$(psql "$DATABASE_URL" -tAc "SELECT COUNT(*) FROM _migrations WHERE filename='$basename'")
            if [ "$applied" = "0" ]; then
              echo "Applying migration: $f"
              psql "$DATABASE_URL" -f "$f" || { echo "Migration failed: $f"; exit 1; }
              psql "$DATABASE_URL" -c "INSERT INTO _migrations (filename) VALUES ('$basename')"
            else
              echo "Skipping (already applied): $f"
            fi
          done
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build & Deploy
        run: npm run deploy
        working-directory: code
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          USE_POSTGRES: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          BUPOS_ORG_ID: ${{ secrets.BUPOS_ORG_ID }}
          BUPOS_LOCATION_ID: ${{ secrets.BUPOS_LOCATION_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
