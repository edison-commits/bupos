<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BasicUniformPOS — Offline</title>
  <style>
    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #f3f3f3; color: #1b1a19;
      display: flex; align-items: center; justify-content: center;
      height: 100vh; margin: 0;
    }
    .card {
      background: #fff; border: 1px solid #e1dfdd; border-radius: 8px;
      padding: 40px 48px; text-align: center; max-width: 420px;
      box-shadow: 0 4px 8px rgba(0,0,0,.10), 0 0 2px rgba(0,0,0,.12);
    }
    .mark {
      width: 48px; height: 48px; border-radius: 10px; background: #0f766e;
      color: #fff; font-size: 24px; font-weight: 700; line-height: 48px;
      margin: 0 auto 16px;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #605e5c; font-size: 14px; line-height: 1.5; margin: 0; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: #d97706; margin-right: 6px; animation: pulse 1.2s infinite; }
    @keyframes pulse { 50% { opacity: .3; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">B</div>
    <h1>You're offline</h1>
    <p><span class="dot"></span>Waiting for the connection to come back — the register will reload automatically. Sales made just before the outage are queued and will sync on reconnect.</p>
  </div>
</body>
</html>
